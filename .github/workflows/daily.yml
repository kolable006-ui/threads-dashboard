name: Daily Threads Dashboard

# 每天台灣時間 12:00（UTC 04:00）跑一次；也可手動觸發。
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

# 用內建 GITHUB_TOKEN 寫回 repo，不需要 PAT。
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run pipeline (build only)
        env:
          # 若你有登入 cookie 想看到更多結果，可在 repo Secrets 設 THREADS_COOKIE
          THREADS_COOKIE: ${{ secrets.THREADS_COOKIE }}
        run: |
          python src/run.py --no-publish

      - name: Publish index.html + state
        run: |
          cp build/index.html index.html
          git config user.name  "Threads Dashboard Bot"
          git config user.email "auto@cowork.local"
          git add index.html data/state.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "Daily update $(date -u +%Y-%m-%d)"
            git push
          fi
