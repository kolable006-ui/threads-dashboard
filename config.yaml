# ============================================================
#  Threads 投資監測儀表板 — 設定檔
#  改這個檔就能調整工具行為，不用動 Python。
# ============================================================

# --- 抓取 ---
search_keywords:        # 每個關鍵字會掃 Threads 搜尋頁
  - 投資
  - 台股
  - 理財
  - 存股
  - 選股
  - 高股息
  - 投資理財
  - 美股

scroll_rounds: 3        # 每個關鍵字頁面往下捲幾次（登入後才有效，未登入約只看得到前 4 則）
page_wait_ms: 3500      # 每頁載入後等待毫秒數

# --- 篩選 ---
min_likes: 1000         # 讚數門檻
days_window: 17         # 幾天內的貼文才收
require_zh: true        # 只收含繁中/中文的貼文

# 命中任一關鍵字就排除（報明牌 / 詐騙 / 拉群）
exclude_patterns:
  - 漲停女王
  - 報明牌
  - 帶你下車
  - 帶單
  - 老師帶
  - 私訊我
  - 加賴
  - 加 line
  - line 群
  - 飆股群
  - 保證獲利
  - 穩賺
  - 預言
  - 內線
  - 跟單
  # --- 補強：報明牌／拉抬／詐騙型常見字（2026-06 觀察新增）---
  - 漲到          # 「台積電6/26會漲到2500」這類喊價
  - 會漲到
  - 黑馬
  - 錯過等
  - 獨家專利
  - 五大巨頭
  - 震爆彈
  - 不要再買
  - 後刪除        # 「9小時後刪除」誘導點擊
  - 嘎漲停
  - 投顧
  # --- 補強：政治口水／指名公眾人物（不適合做廣告腳本，2026-06-24 新增）---
  - 立委
  - 葛如鈞
  - 威如
  - 財產申報

# --- 卡片數 ---
max_cards: 14

# --- 分群 (G1–G8) 關鍵字 → 用於自動分類，命中順序由上往下 ---
groups:
  G2: { name: 勵志案例,  keywords: [里程碑, 終於, 賠掉, 第一次, 存到, 退休, 達成] }
  G4: { name: 教學技巧,  keywords: [教學, 怎麼選, 比較, 步驟, 教你, 帶你看, 解析] }
  G5: { name: ETF配息,  keywords: [配息, 殖利率, 填息, 除息, "0056", "00919", "00918", 高股息] }
  G6: { name: 新手討論,  keywords: [新手, 小白, 剛開始, 第一次買, 還來得及, 不懂盤, 小資] }
  G7: { name: 節目筆記,  keywords: [筆記, 股癌, EP, 節目, 訪談, podcast] }
  G8: { name: AI＋財經, keywords: [AI, GPT, 自動, 程式, 工具, 模型] }
  G3: { name: 理財觀念,  keywords: [觀念, 心態, 為什麼, 其實, 別再, 邏輯, 思維] }
  G1: { name: 盤後評論,  keywords: [] }   # 預設群（其餘都歸這）

# --- 8 份懶人包（廣告腳本可對應） ---
packs:
  - 巴菲特給孩子的 5 個 ETF 投資策略
  - 5 種台股賺錢策略
  - 小資翻倍存錢法（自動分帳法、逆向扣款存錢法、高效利率槓桿法）
  - 高級當沖策略（怎麼挑標的、實際操作的邏輯）
  - 100 個財經專有名詞
  - 新手投資入門手冊（選券商、開戶、認識成本、買第一張股票）
  - 新手最常忽略的 ETF 代號（6 碼新制、用最後一碼辨識類型與風險）
  - 散戶最常踩的 6 個紀律破口（情緒進出、沒規則就進場、賺小賠大、部位忽大忽小、沒紀錄、重押單一標的）

# 主推懶人包：每天的腳本會優先多搭配這幾份（其餘 1 支留給當天最相關的）。
# 想換主推哪幾份，改這個清單就好；標題要和上面 packs 完全一致。
priority_packs:
  - 新手投資入門手冊（選券商、開戶、認識成本、買第一張股票）
  - 新手最常忽略的 ETF 代號（6 碼新制、用最後一碼辨識類型與風險）
  - 散戶最常踩的 6 個紀律破口（情緒進出、沒規則就進場、賺小賠大、部位忽大忽小、沒紀錄、重押單一標的）

# 關鍵字 → 建議對應懶人包（產生腳本框架時提示用；命中第一個就採用）
# 注意：dict 由上往下找，較專一的關鍵字請放前面（例如「代號」要在「ETF」之前）。
pack_hints:
  代號: 新手最常忽略的 ETF 代號（6 碼新制、用最後一碼辨識類型與風險）
  開戶: 新手投資入門手冊（選券商、開戶、認識成本、買第一張股票）
  券商: 新手投資入門手冊（選券商、開戶、認識成本、買第一張股票）
  第一張: 新手投資入門手冊（選券商、開戶、認識成本、買第一張股票）
  入門: 新手投資入門手冊（選券商、開戶、認識成本、買第一張股票）
  新手: 新手投資入門手冊（選券商、開戶、認識成本、買第一張股票）
  小白: 新手投資入門手冊（選券商、開戶、認識成本、買第一張股票）
  停損: 散戶最常踩的 6 個紀律破口（情緒進出、沒規則就進場、賺小賠大、部位忽大忽小、沒紀錄、重押單一標的）
  紀律: 散戶最常踩的 6 個紀律破口（情緒進出、沒規則就進場、賺小賠大、部位忽大忽小、沒紀錄、重押單一標的）
  規則: 散戶最常踩的 6 個紀律破口（情緒進出、沒規則就進場、賺小賠大、部位忽大忽小、沒紀錄、重押單一標的）
  風險: 散戶最常踩的 6 個紀律破口（情緒進出、沒規則就進場、賺小賠大、部位忽大忽小、沒紀錄、重押單一標的）
  系統: 散戶最常踩的 6 個紀律破口（情緒進出、沒規則就進場、賺小賠大、部位忽大忽小、沒紀錄、重押單一標的）
  複盤: 散戶最常踩的 6 個紀律破口（情緒進出、沒規則就進場、賺小賠大、部位忽大忽小、沒紀錄、重押單一標的）
  ETF: 巴菲特給孩子的 5 個 ETF 投資策略
  存股: 巴菲特給孩子的 5 個 ETF 投資策略
  台股: 5 種台股賺錢策略
  存錢: 小資翻倍存錢法（自動分帳法、逆向扣款存錢法、高效利率槓桿法）
  小資: 小資翻倍存錢法（自動分帳法、逆向扣款存錢法、高效利率槓桿法）
  當沖: 高級當沖策略（怎麼挑標的、實際操作的邏輯）
  名詞: 100 個財經專有名詞

# 產生幾支廣告腳本框架
script_count: 4

# --- 發布 ---
publish:
  repo: kolable006-ui/threads-dashboard   # owner/repo
  branch: main
  index_path: index.html
  # token 從環境變數讀，不寫在這裡：
  #   GH_TOKEN        外部 PAT（跨 repo 用）
  #   或 GITHUB_TOKEN  GitHub Actions 內建（同 repo 用，推薦）
  commit_email: auto@cowork.local
  commit_name: Threads Dashboard Bot
